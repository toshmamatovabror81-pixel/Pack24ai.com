# pack24.uz: mavjud nginx orqali (Caddy o'rniga). server-setup.sh buni
# /etc/nginx/sites-available/pack24.uz ga nusxalaydi va __WEB_PORT__ ni .env dagi WEB_PORT bilan almashtiradi.
# HTTPS va 80 -> 443 yo'naltirishni certbot qo'shadi:
#   certbot --nginx -d pack24.uz -d www.pack24.uz --redirect
server {
    listen 80;
    listen [::]:80;
    server_name pack24.uz www.pack24.uz;

    # Rasm yuklash (admin) 5 MB gacha; zaxira bilan
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
    }
}
